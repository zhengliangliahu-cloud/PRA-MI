trainer:
  engine: lightning
  accelerator: gpu
  devices: 1
  max_epochs: 8
  batch_size: 128
  num_workers: 4
  val_subjects: 1
  pin_memory: true
  precision: 32
  matmul_precision: high
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_scheduler: reduce_on_plateau
  lr_factor: 0.5
  lr_patience: 2
  min_lr: 1.0e-5
  monitor: val_loss
  early_stopping_patience: 3
  early_stopping_min_delta: 1.0e-4
  deterministic: true
  log_every_n_steps: 10
